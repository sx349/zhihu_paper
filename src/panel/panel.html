<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知乎论文助手</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="chrome">
    <img class="mark" src="../../icons/icon-48.png" alt="">
    <span class="nm">知乎论文助手</span>
    <button id="refresh" class="icon" title="刷新">⟳</button>
    <button id="settings" class="icon" title="设置">⚙</button>
  </header>

  <main id="root">
    <div class="placeholder">
      <p class="big">未识别到论文</p>
      <p>支持 arXiv、SSRN、NBER、JSTOR、IEEE、PubMed 及主要出版社平台。</p>
    </div>
  </main>

  <footer id="foot" hidden>
    <div class="btns">
      <button id="primary" class="btn pri" disabled>参与讨论</button>
      <button id="ask"     class="btn">发起提问</button>
    </div>
  </footer>

  <script src="panel.js" type="module"></script>
</body>
</html>
