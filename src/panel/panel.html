<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知乎论文助手</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>
  <header class="chrome">
    <span class="mark"></span>
    <span class="nm">知乎论文助手</span>
    <button id="settings" class="icon" title="设置">⚙</button>
  </header>

  <main id="root">
    <div class="placeholder">
      <p class="big">未识别到论文</p>
      <p>支持 arXiv、SSRN、NBER、JSTOR、IEEE、PubMed 及主要出版社平台。</p>
    </div>
  </main>

  <footer id="foot" hidden>
    <div class="fbbar">
      <span class="q">结果是否有帮助？</span>
      <button class="tb up" data-v="up"   aria-pressed="false" aria-label="有帮助">👍</button>
      <button class="tb dn" data-v="down" aria-pressed="false" aria-label="没帮助">👎</button>
    </div>
    <div class="btns">
      <button id="primary" class="btn pri">去知乎讨论</button>
      <button id="report"  class="btn">提交反馈</button>
    </div>
  </footer>

  <dialog id="fbdlg">
    <form method="dialog">
      <h2>提交反馈</h2>
      <p class="hint">请描述匹配结果的问题。</p>
      <textarea id="fbtext" rows="5" placeholder="例如：第 2 条和这篇论文无关"></textarea>
      <div class="dlgbtns">
        <button value="cancel" class="btn">取消</button>
        <button value="send" id="fbsend" class="btn pri">发送</button>
      </div>
    </form>
  </dialog>

  <script src="panel.js" type="module"></script>
</body>
</html>
